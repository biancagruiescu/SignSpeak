<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignSpeak - Login</title>
  <link rel="stylesheet" href="../css/login-page.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page">
   <header class="navbar">
  <a href="index.html" class="logo">
    <div class="logo-icon">🤟</div>
    <span>SignSpeak</span>
  </a>

  <div class="nav-actions">
    <a href="index.html" class="back-link">← Home</a>
    <a href="signup-page.html" class="sign-btn">Create Account</a>
  </div>
</header>
    <main class="login-section">
      <div class="login-card">
        <h1>Welcome back</h1>
        <p>Sign in to access your recognition history</p>

        <form class="login-form" onsubmit="return validateLogin()" novalidate>
          <p id="loginError" class="error-text"></p>

          <input type="text" id="loginEmail" placeholder="Email" required>
          <input type="password" id="loginPassword" placeholder="Password" required>

          <button type="submit" class="sign-in-btn">
            <span class="btn-icon">↪</span>
            <span>Sign In</span>
          </button>
        </form>

        <div class="signup-text">
          Don't have an account? <a href="signup-page.html">Sign up</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../scripts/scripts.js"></script>
</body>
</html>
